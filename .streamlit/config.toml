# 대시보드 테마 — docs/05_design/UI_SPECIFICATION.md 2-6절 그대로.
# 저장소 루트에서 `streamlit run dashboard/app.py` 로 실행할 때 읽힌다.
[theme]
font = "Noto Sans KR:https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap, sans-serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "1.75rem"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = true

[theme.light]
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F9"
textColor = "#1A1F29"
borderColor = "#D5DAE1"
linkColor = "#1F4E79"
dataframeHeaderBackgroundColor = "#F4F6F9"
blueBackgroundColor = "#E8F1FC"
blueTextColor = "#1D5FB3"
redBackgroundColor = "#FCEBEB"
redTextColor = "#A92A2A"
grayBackgroundColor = "#EEF0F3"
grayTextColor = "#4B5361"
chartCategoricalColors = ["#716DF6", "#A20519", "#11598F", "#B0698C", "#C68206"]
chartSequentialColors = ["#CDE2FB", "#9EC5F4", "#86B6EF", "#6DA7EC", "#5598E7", "#3987E5", "#2A78D6", "#256ABF", "#184F95", "#0D366B"]

[theme.light.sidebar]
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#2F6FB0"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#E6E9EF"
borderColor = "#2F3644"
linkColor = "#8CB8E6"
dataframeHeaderBackgroundColor = "#1A1F2B"
blueBackgroundColor = "#172A44"
blueTextColor = "#9CC4F5"
redBackgroundColor = "#3B1C1F"
redTextColor = "#F2A0A0"
grayBackgroundColor = "#262C37"
grayTextColor = "#C3C9D3"
chartCategoricalColors = ["#737AFC", "#BA2B2E", "#0A67A9", "#EA589A", "#D79628"]
chartSequentialColors = ["#0D366B", "#184F95", "#256ABF", "#2A78D6", "#3987E5", "#5598E7", "#6DA7EC", "#86B6EF", "#9EC5F4", "#CDE2FB"]

[theme.dark.sidebar]
backgroundColor = "#1A1F2B"
secondaryBackgroundColor = "#0E1117"
