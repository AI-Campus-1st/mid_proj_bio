# main 에 push 할 때마다 앱 이미지를 빌드해 ghcr.io(비공개)에 올리고 Render 에 배포한다.
# 데이터 이미지(ghcr.io/ai-campus-1st/mid_proj_bio-data)는 팀원이 로컬에서 올린다 — docs/06_technical/DEPLOYMENT.md
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ai-campus-1st/mid_proj_bio
  DATA_IMAGE: ghcr.io/ai-campus-1st/mid_proj_bio-data:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 같은 토큰으로 데이터 이미지 pull 과 앱 이미지 push 를 한다.
      # 데이터 패키지 설정 > Manage Actions access 에 이 저장소(Read)를 추가해 두어야 pull 이 된다.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DATA_IMAGE=${{ env.DATA_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha

      # Render 는 레지스트리 태그가 바뀌어도 스스로 다시 배포하지 않는다. 배포 훅으로 방금 올린 이미지(digest 고정)를 배포한다.
      # 저장소 Secret RENDER_DEPLOY_HOOK 이 없으면 이 단계는 건너뛴다 (이미지만 올림).
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK 이 없어 Render 배포를 건너뜁니다."
            exit 0
          fi
          # imgURL 은 서비스에 등록한 이미지 URL 과 태그/digest 만 달라야 한다 (Render deploy hooks 문서)
          curl -fsS -G "$RENDER_DEPLOY_HOOK" --data-urlencode "imgURL=${IMAGE}@${DIGEST}" > /dev/null
          echo "Render 배포 요청: ${IMAGE}@${DIGEST}"
